<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dreams">
<meta name="theme-color" content="#111213">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Dream Journal</title>
<style>
:root{
  --bg:#111213; --bg2:#161719; --surface:#1a1b1d; --line:#2b2d30;
  --text:#e9e7e3; --muted:#a6a39d; --faint:#75726d;
  --accent:#e9e7e3; --accent2:#8d8a84; --ink:#151515;
  --gold:#cdb98f; --mark:rgba(205,185,143,.16); --danger:#e58b85;
  --r:12px; --serif:ui-serif,"New York",Georgia,"Times New Roman",serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;min-height:100vh;
  background:var(--bg);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:var(--text)}
svg{display:block}
.hidden{display:none!important}

/* top bars */
.bar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  padding:calc(var(--st) + 8px) 12px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar h1{margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.bar-l{justify-self:start}.bar-r{justify-self:end;display:flex;align-items:center}
.txt{color:var(--accent);font-size:17px;padding:8px 6px}
.txt.strong{font-weight:600}
.back{display:flex;align-items:center;color:var(--accent);font-size:17px;padding:8px 4px 8px 0}
.back svg{width:22px;height:22px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--accent)}
.icon-btn svg{width:23px;height:23px}
.saved{font-size:13px;color:var(--faint);opacity:0;transition:opacity .4s;padding-right:6px}
.saved.on{opacity:1}

.home-top{max-width:640px;margin:0 auto;padding:calc(var(--st) + 18px) 16px 4px 20px;display:flex;align-items:center;justify-content:space-between}
.home-top .back{margin:0 0 2px -2px;font-size:16px}
.home-top h1{margin:0;font-family:var(--serif);font-weight:500;font-size:32px;letter-spacing:.2px}
.home-top .sub{color:var(--faint);font-size:14px;margin-top:2px}

main{max-width:640px;margin:0 auto;padding:14px 16px calc(130px + var(--sb))}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sec-h h2{margin:0}
.sec-h .txt{font-size:15px;padding:4px 2px}
body.no-help .explain,body.no-help .hint.help,body.no-help .intro{display:none}
.explain{margin:0 0 12px;color:var(--muted);font-size:14.5px;line-height:1.45}
.hint{margin:10px 0 0;color:var(--faint);font-size:13.5px}
textarea,.field{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;line-height:1.5;outline:none;resize:vertical;-webkit-appearance:none}
textarea:focus,.field:focus{border-color:var(--accent2)}
textarea::placeholder,.field::placeholder{color:var(--faint)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font-weight:600;
  background:var(--accent);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:10px 14px;font-size:15px}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1}

.fab{border-radius:10px!important;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 22px);z-index:30;
  display:flex;align-items:center;gap:8px;padding:16px 28px;border-radius:999px;font-weight:600;font-size:17px;
  background:var(--accent);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fab svg{width:20px;height:20px}

/* home list */
.search{margin:6px 0 4px}
.month{margin:20px 4px 8px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.dcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.dcard:active{background:#202124}
.dc-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--faint)}
.dc-top .tag{margin-left:auto;font-size:12px;color:var(--gold);display:flex;align-items:center;gap:5px}
.dc-top .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.dc-title{font-family:var(--serif);font-size:18.5px;margin:3px 0 3px;line-height:1.3}
.dc-snip{color:var(--muted);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dc-els{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.pill{font-size:12.5px;padding:3px 8px;border-radius:6px;background:var(--mark);color:var(--gold)}
.empty{text-align:center;padding:56px 24px 0;color:var(--muted)}
.empty .moon{font-family:var(--serif);font-size:20px;color:var(--text);margin:14px 0 8px}
.empty p{margin:0 auto;max-width:300px;font-size:15px}
.banner{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin:6px 0 10px;font-size:14.5px;color:var(--muted)}
.banner b{color:var(--text);font-weight:600;display:block}
.banner .btn{flex:none}

/* focus mode: everything but the field you're writing in fades away */
.bar,.title-in,.date-line,.danger-zone,.card,.card>*,.sec-h>*,.el,.el>*,.el-h>*,#elements>*,.add-row{transition:opacity .25s,background-color .25s,border-color .25s}
body.focusing .bar{opacity:0;pointer-events:none}
.f-hide{opacity:0!important;pointer-events:none!important}
.f-bare{background-color:transparent!important;border-color:transparent!important}
.f-dim{opacity:.45}
.f-dim .x,.f-dim .link{opacity:0!important;pointer-events:none}
.done-btn{position:fixed;top:calc(var(--st) + 8px);right:12px;z-index:45;padding:8px 14px;font-size:16px;color:var(--muted);border-radius:8px}
.write.typing .corner,.write.typing .install-note,.write.typing h1,.write.has-text h1{opacity:0;pointer-events:none}
.install-note{transition:opacity .3s;flex:none}
body.writing{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none}

/* writing screen (home) */
.write{position:fixed;left:0;right:0;top:0;height:100%;height:var(--vvh,100%);overflow:hidden;display:flex;flex-direction:column;padding:calc(var(--st) + 8px) 20px calc(var(--sb) + 20px)}
.corner{align-self:flex-end;padding:10px 4px;font-size:15px;letter-spacing:.04em;color:var(--faint);transition:opacity .3s}
.write-body{flex:1;min-height:0;width:100%;max-width:600px;margin:0 auto;padding-top:12svh;display:flex;flex-direction:column}
.write h1{margin:0 0 22px;text-align:center;font-family:var(--serif);font-weight:400;font-size:34px;letter-spacing:.2px;color:var(--text);transition:opacity .3s}
.write textarea{width:100%;flex:1 1 auto;min-height:0;overflow-y:auto!important;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border:0;border-radius:0;background:transparent;padding:4px 0;outline:none;resize:none;
  font-family:var(--serif);font-size:20px;line-height:1.65;color:var(--text);text-align:left}
.write textarea::placeholder{color:var(--faint);text-align:center}
.write textarea:focus::placeholder{opacity:.5}
.write .save-row{flex:none;display:flex;justify-content:center;padding-top:14px;min-height:64px}
.write .save{padding:12px 34px;border-radius:10px;background:var(--accent);color:var(--ink);font-weight:600;font-size:17px;transition:opacity .25s}
.write .save[disabled]{opacity:0;pointer-events:none}
.install-note{text-align:center;font-size:13px;color:var(--faint);margin:0}

/* capture */
.capture{padding-top:6px}
.date-line{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:14px;margin:4px 2px 8px}
.date-line input{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:5px 9px;color:var(--muted);font-size:15px;-webkit-appearance:none}
.cap-text{width:100%;min-height:58vh;border:0;background:transparent;padding:6px 2px;font-family:var(--serif);font-size:19.5px;line-height:1.6;resize:none}
.cap-text:focus{border:0}

/* dream detail */
.title-in{width:100%;background:transparent;border:0;outline:none;font-family:var(--serif);font-size:24px;padding:4px 2px 10px;color:var(--text)}
.title-in::placeholder{color:var(--faint)}
.dream-text{font-family:var(--serif);font-size:18px;line-height:1.7;white-space:pre-wrap;word-wrap:break-word;-webkit-user-select:text;user-select:text}
.dream-text:empty::before{content:"(empty)";color:var(--faint)}
mark{background:var(--mark);color:inherit;border-bottom:1.5px solid var(--gold);border-radius:3px;padding:0 1px}
.edit-ta{font-family:var(--serif);font-size:18px;line-height:1.6;min-height:200px}
.el{border-top:1px solid var(--line);padding:13px 0 4px}
.el:first-child{border-top:0;padding-top:4px}
.el-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.el-label{font-family:var(--serif);font-size:18px;color:var(--gold)}
.el-h .link{font-size:13px;color:var(--accent);margin-left:auto}
.el-h .x{width:32px;height:32px;color:var(--faint);font-size:22px;border-radius:8px;margin-left:auto}
.el-h .link+.x{margin-left:0}
.el.flash textarea{border-color:var(--gold)}
.add-row{display:flex;gap:8px;margin-top:12px}
.add-row .field{flex:1;min-width:0}
.empty-s{color:var(--faint);font-size:14.5px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-size:15px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip .n{opacity:.65;margin-left:4px;font-weight:400}
details.work{border-top:1px solid var(--line)}
details.work:first-of-type{border-top:0}
details.work summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 0;font-weight:600}
details.work summary::-webkit-details-marker{display:none}
details.work summary::after{content:"+";margin-left:auto;color:var(--accent);font-size:20px;font-weight:400}
details.work[open] summary::after{content:"–"}
details.work .has{width:7px;height:7px;border-radius:50%;background:var(--gold)}
details.work .explain{margin-top:-4px}
details.work textarea{margin-bottom:12px}
.danger-zone{text-align:center;margin-top:24px}

/* patterns */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:26px;font-weight:500}
.stat span{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .lbl{font-family:var(--serif);font-size:17.5px;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
.prow .bar-w{flex:1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.prow .bar-f{height:100%;background:var(--accent2);border-radius:3px}
.prow .cnt{font-size:14px;color:var(--muted);min-width:22px;text-align:right}
details.once summary{color:var(--accent);font-size:15px;padding:10px 0 2px;list-style:none}
details.once summary::-webkit-details-marker{display:none}
.once-list{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px}

/* element page */
.assoc-card{display:block;width:100%;text-align:left}
.assoc-card .when{font-size:13px;color:var(--faint)}
.assoc-card .dt{font-family:var(--serif);font-size:17px;margin:2px 0 8px}
.assoc-card .as{border-left:2px solid var(--gold);padding:2px 0 2px 12px;color:var(--text);white-space:pre-wrap;font-size:15.5px}
.assoc-card .as.none{color:var(--faint);font-style:italic}
.intro{color:var(--muted);font-size:15px;margin:2px 4px 14px}

/* settings */
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:15px}
.steps li{margin-bottom:8px}
.steps b{color:var(--text)}
.foot{text-align:center;color:var(--faint);font-size:13px;margin-top:18px}

/* floating "mark" button + toast */
.mark-btn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 22px);z-index:40;max-width:calc(100vw - 32px);
  padding:14px 22px;border-radius:10px;background:var(--accent);color:var(--ink);font-weight:600;font-size:16px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(var(--sb) + 16px)}
.sheet{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px 16px}
.sheet p{margin:0 0 16px;font-size:16.5px;line-height:1.45}
.sheet .btn-row .btn.ok-danger{background:var(--danger);color:#1c0c0b}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translate(-50%,10px);z-index:50;opacity:0;pointer-events:none;
  background:#2a2b2e;color:var(--text);padding:11px 18px;border-radius:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  transition:opacity .25s,transform .25s;max-width:calc(100vw - 40px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>
<button class="mark-btn hidden" id="markBtn" type="button"></button>
<div class="toast" id="toast"></div>
<button class="done-btn hidden" id="doneBtn" type="button">Done</button>
<div class="sheet-bg hidden" id="sheet"><div class="sheet" role="dialog" aria-modal="true"><p id="sheetMsg"></p><div class="btn-row"><button class="btn ghost" id="sheetNo" type="button">Cancel</button><button class="btn" id="sheetOk" type="button">OK</button></div></div></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
(() => {
'use strict';

/* ---------- storage ---------- */
const K_DREAMS = 'dj.dreams.v1', K_META = 'dj.meta.v1', K_DRAFT = 'dj.draft.v1';
const readJSON = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Could not save — storage may be full.'); return false; } };

let dreams = readJSON(K_DREAMS, []);
let meta = readJSON(K_META, {});
const saveAll = () => writeJSON(K_DREAMS, dreams);
const saveMeta = () => writeJSON(K_META, meta);

/* ---------- constants ---------- */
const FEELINGS = ['Fear','Anxiety','Shame','Guilt','Anger','Sadness','Longing','Desire','Joy','Relief','Confusion','Calm','Disgust','Excitement'];
const WORK = [
  ['condensation', 'Condensation', 'Several people, places or ideas fused into one figure or image. Who or what might be combined here?'],
  ['displacement', 'Displacement', 'Strong feeling attached to something trivial — or something important treated as if it didn\'t matter.'],
  ['symbolization', 'Symbolization', 'An image standing in for something else, often something harder to look at directly.'],
  ['secondary', 'Secondary revision', 'How the dream got tidied into a story as you woke or retold it: gaps, sudden jumps, parts you "filled in".']
];
const I = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  stars: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="17" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="19" cy="14" r="2"/><path d="M6.6 15.8L10.6 7.6M13.7 7.2l4 5.4"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>'
};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s).toLowerCase().replace(/\s+/g, ' ').trim();
const PUNCT = /^[\s"'“”‘’«».,;:!?()\[\]\-–—…]+|[\s"'“”‘’«».,;:!?()\[\]\-–—…]+$/g;
const clean = (s) => String(s).replace(/\s+/g, ' ').replace(PUNCT, '');
const isWordChar = (c) => !!c && /[\p{L}\p{N}]/u.test(c);
function todayISO() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function fmtDate(iso, opts) {
  const [y, m, d] = String(iso).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1).toLocaleDateString(undefined, opts || { weekday: 'short', day: 'numeric', month: 'short' });
}
const getDream = (id) => dreams.find((d) => d.id === id);
const sorted = () => [...dreams].sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.createdAt - a.createdAt);
const isExplored = (d) => !!(d.residue || d.wish || d.feelingNote || (d.elements && d.elements.length));
function titleOf(d) {
  if (d.title && d.title.trim()) return d.title.trim();
  const first = (d.text || '').trim().split('\n')[0];
  const m = first.match(/^.*?[.!?](\s|$)/);
  const t = (m ? m[0] : first).trim();
  return t ? (t.length > 64 ? t.slice(0, 61).trim() + '…' : t) : 'Untitled dream';
}
function blankDream(text, date) {
  const now = Date.now();
  return { id: uid(), date: date || todayISO(), createdAt: now, updatedAt: now, title: '', text: text || '',
    residue: '', feelings: [], feelingNote: '', elements: [], work: {}, wish: '' };
}
function sanitize(x) {
  if (!x || typeof x !== 'object' || typeof x.id !== 'string') return null;
  const d = blankDream('', /^\d{4}-\d{2}-\d{2}$/.test(x.date) ? x.date : todayISO());
  const s = (v) => (typeof v === 'string' ? v : '');
  Object.assign(d, {
    id: x.id, title: s(x.title), text: s(x.text), residue: s(x.residue), feelingNote: s(x.feelingNote), wish: s(x.wish),
    createdAt: Number(x.createdAt) || Date.now(), updatedAt: Number(x.updatedAt) || Date.now(),
    feelings: Array.isArray(x.feelings) ? x.feelings.filter((f) => typeof f === 'string') : [],
    elements: Array.isArray(x.elements) ? x.elements.filter((e) => e && typeof e.label === 'string')
      .map((e) => ({ id: typeof e.id === 'string' ? e.id : uid(), label: e.label, assoc: s(e.assoc) })) : [],
    work: {}

  </main>`;
  bindBack('/journal');
  app.querySelector('main').onclick = (e) => { const b = e.target.closest('[data-k]'); if (b) go('/element/' + b.dataset.k); };
}

/* ---------- ELEMENT ---------- */
function viewElement(key) {
  const marked = sorted().filter((d) => d.elements.some((e) => norm(e.label) === key));
  const label = marked.length ? marked[0].elements.find((e) => norm(e.label) === key).label : key;
  const unmarked = sorted().filter((d) => !marked.includes(d) && isStartBounded(d.text.toLowerCase(), key));
  app.innerHTML = bar(label, backBtn()) + `
  <main>
    <p class="intro">Appears in <b>${marked.length}</b> dream${marked.length === 1 ? '' : 's'}. Reading your associations together can show what this image keeps pointing to.</p>
    ${marked.map((d) => {
      const e = d.elements.find((x) => norm(x.label) === key);
      return `<button class="card assoc-card" data-id="${esc(d.id)}" type="button"><div class="when">${esc(fmtDate(d.date, { day: 'numeric', month: 'short', year: 'numeric' }))}</div>
        <div class="dt">${esc(titleOf(d))}</div>
        <div class="as${e.assoc.trim() ? '' : ' none'}">${e.assoc.trim() ? esc(e.assoc.trim()) : 'No associations written yet.'}</div></button>`;
    }).join('')}
    ${unmarked.length ? `<div class="month">Mentioned, but not marked</div>
      ${unmarked.map((d) => `<button class="dcard" data-id="${esc(d.id)}" type="button"><div class="dc-top">${esc(fmtDate(d.date))}</div><div class="dc-title">${esc(titleOf(d))}</div></button>`).join('')}` : ''}
  </main>`;
  bindBack('/patterns');
  app.querySelector('main').onclick = (e) => { const b = e.target.closest('[data-id]'); if (b) go('/dream/' + b.dataset.id); };
}
function isStartBounded(lower, n) {
  let p = 0;
  while ((p = lower.indexOf(n, p)) !== -1) { if (!isWordChar(lower[p - 1]) || !isWordChar(n[0])) return true; p += n.length; }
  return false;
}

/* ---------- SETTINGS / BACKUP ---------- */
function viewSettings() {
  const lb = meta.lastBackup;
  app.innerHTML = bar('Backup & guide', backBtn('Journal')) + `
  <main>
    <section class="card">
      <h2>Backup</h2>
      <p class="explain">Your dreams are stored only on this iPhone, inside this app — nothing is uploaded anywhere. That keeps them private, but it also means a lost phone or cleared data would erase them. Export a backup every week or two and save it to iCloud Drive or Files, or email it to yourself.</p>
      <p class="explain" style="color:var(--text)">Last backup: <b>${lb ? esc(new Date(lb).toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' })) + (daysSince(lb) ? ` (${daysSince(lb)} day${daysSince(lb) > 1 ? 's' : ''} ago)` : ' (today)') : 'never'}</b></p>
      <div class="btn-row">
        <button class="btn" id="exp" type="button">Export backup</button>
        <button class="btn ghost" id="imp" type="button">Restore</button>
      </div>
      <p class="hint">Restoring adds dreams from a backup file. Dreams already here are kept; if the same dream is in both, the more recently edited version wins.</p>
    </section>
    <section class="card">
      <h2>Explanations</h2>
      <p class="empty-s" style="margin-bottom:12px">Short notes under each section that describe the method. They appear the first time you open a dream.</p>
      <button class="btn ghost small" id="helpToggle" type="button">${meta.helpSeen ? 'Show them again' : 'Hide them'}</button>
    </section>
    <section class="card">
      <h2>How to use it</h2>
      <ol class="steps">
        <li><b>On waking:</b> open the app and write everything on the first screen, before it fades. Don't interpret yet.</li>
        <li><b>Later in the day:</b> open the dream. Note the <b>day residue</b> — what happened yesterday.</li>
        <li><b>Mark elements:</b> press and hold words in the dream (a person, place, object, phrase). Take each one separately and write your free associations. Don't censor; the unexpected ones matter most.</li>
        <li><b>Notice the feelings,</b> especially ones that seem out of proportion or attached to the wrong thing.</li>
        <li><b>Only then</b> write a tentative reading of the latent content: what wish, fear or conflict might be at work.</li>
        <li><b>Over time,</b> check Patterns. Recurring elements, read side by side, are often the most revealing.</li>
      </ol>
    </section>
    <p class="foot">Dream Journal · ${dreams.length} dream${dreams.length === 1 ? '' : 's'} stored on this device</p>
  </main>`;
  bindBack('/journal');
  $('#exp').onclick = exportBackup;
  $('#helpToggle').onclick = () => { meta.helpSeen = !meta.helpSeen; saveMeta(); route(); toast(meta.helpSeen ? 'Explanations hidden.' : 'Explanations will show again.'); };
  $('#imp').onclick = () => $('#importFile').click();
}
async function exportBackup() {
  if (!dreams.length) { toast('No dreams to back up yet.'); return; }
  const name = `dream-journal-backup-${todayISO()}.json`;
  const json = JSON.stringify({ app: 'dream-journal', version: 1, exportedAt: new Date().toISOString(), dreams }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  let file = null;
  try { file = new File([blob], name, { type: 'application/json' }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Dream Journal backup' }); markBackedUp(); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  markBackedUp();
}
function markBackedUp() {
  meta.lastBackup = Date.now(); saveMeta(); toast('Backup exported.');
  if (curPath() === '/settings' || curPath() === '/journal') route();
}
$('#importFile').addEventListener('change', async (ev) => {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const arr = Array.isArray(data) ? data : data && Array.isArray(data.dreams) ? data.dreams : null;
    if (!arr) throw new Error('bad');
    let added = 0, updated = 0;
    for (const raw of arr) {
      const d = sanitize(raw); if (!d) continue;
      const i = dreams.findIndex((x) => x.id === d.id);
      if (i < 0) { dreams.push(d); added++; }
      else if (d.updatedAt > dreams[i].updatedAt) { dreams[i] = d; updated++; }
    }
    if (saveAll()) {
      requestPersist();
      toast(added || updated ? `Restored: ${added} added${updated ? `, ${updated} updated` : ''}.` : 'Everything in that backup is already here.');
      route();
    }
  } catch (e) { toast("That file doesn't look like a Dream Journal backup."); }
});

/* ---------- fit the writing screen to the space above the keyboard ---------- */
(function () {
  const vv = window.visualViewport; if (!vv) return;
  let raf = 0, last = 0;
  const fit = () => {
    raf = 0;
    if (!$('#write')) return;
    const h = Math.round(vv.height);
    if (Math.abs(h - last) < 2) return;
    last = h; document.documentElement.style.setProperty('--vvh', h + 'px');
  };
  vv.addEventListener('resize', () => { if (!raf) raf = requestAnimationFrame(fit); });
})();

/* ---------- start ---------- */
dreams = dreams.map(sanitize).filter(Boolean);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
route();
})();
</script>
</body>
